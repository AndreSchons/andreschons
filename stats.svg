<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 430" role="img" aria-label="GitHub stats">
<style>
  .bg { fill:#0d1117; }
  .h1 { fill:#f0f6fc; font:700 24px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .sub { fill:#8b949e; font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .num { fill:#39d353; font:700 22px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .lab { fill:#c9d1d9; font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .card { fill:#161b22; stroke:#30363d; stroke-width:1; }
  .line { opacity:0; animation:in .45s ease forwards; }
  @keyframes in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
</style>
<rect class="bg" width="100%" height="100%" rx="14"/>
<text x="32" y="46" class="h1">André Schons</text>
<text x="32" y="72" class="sub">Backend Developer · Autumn Softwares</text>
<text x="32" y="96" class="sub">Santa Catarina, Brazil</text>
<text x="32" y="122" class="sub">APIs · SaaS · ERP · Fiscal systems</text>

